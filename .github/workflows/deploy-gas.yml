# ส่งโค้ดในโฟลเดอร์ gas/ ขึ้น Apps Script แล้วอัปเดต deployment เดิม (URL ไม่เปลี่ยน)
# ต้องตั้ง Secrets: CLASPRC_JSON (เนื้อหาไฟล์ ~/.clasprc.json), SCRIPT_ID, DEPLOYMENT_ID
name: deploy-gas
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test test/*.test.js
      - run: npm install -g @google/clasp@2
      - name: clasp credentials
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
          echo '{"scriptId":"${{ secrets.SCRIPT_ID }}","rootDir":"gas"}' > .clasp.json
      - run: clasp push --force
      - run: clasp deploy --deploymentId "${{ secrets.DEPLOYMENT_ID }}" --description "github ${{ github.sha }}"
