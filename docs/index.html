<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FireCheck · ทีม ENV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<script src="config.js"></script>
<style>
:root{
  --bg:#EDF1F5;--surface:#fff;--surface-2:#F5F7FA;--ink:#132033;--ink-2:#3F5068;--muted:#66768A;--line:#D7DFE8;--line-strong:#B6C3D1;
  --accent:#1D5FA6;--accent-ink:#fff;--accent-soft:#E2ECF7;
  --ok:#17784D;--ok-soft:#DFF1E7;--ok-dot:#23A26A;--warn:#9A6200;--warn-soft:#FAEFD6;--warn-dot:#E0A21B;
  --crit:#B83227;--crit-soft:#FAE3E0;--crit-dot:#D6453A;--absent:#5F46A8;--absent-soft:#ECE6F8;--absent-dot:#8466D0;
  --f-d:"Chakra Petch","IBM Plex Sans Thai",Tahoma,sans-serif;--f-b:"IBM Plex Sans Thai","Leelawadee UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B1118;--surface:#131C27;--surface-2:#192432;--ink:#E3E9F0;--ink-2:#B4C1CF;--muted:#8494A7;--line:#243140;--line-strong:#344557;
  --accent:#6EA6E6;--accent-ink:#0B1118;--accent-soft:#1A2C43;--ok:#56C893;--ok-soft:#14302A;--ok-dot:#3DB47C;--warn:#E8B350;--warn-soft:#33291A;--warn-dot:#E0A93A;
  --crit:#F27D72;--crit-soft:#3A1F1E;--crit-dot:#E5584C;--absent:#B39DF2;--absent-soft:#272042;--absent-dot:#9479E0;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-b);padding:0 16px 40px}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto}
.muted{color:var(--muted)} .small{font-size:13px}
.tx-ok{color:var(--ok)} .tx-crit{color:var(--crit)} .tx-warn{color:var(--warn)} .tx-absent{color:var(--absent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:1px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-crit{background:var(--crit-soft);color:var(--crit)}
.c-absent{background:var(--absent-soft);color:var(--absent)} .c-mute{background:var(--surface-2);color:var(--muted)} .c-acc{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;font-family:var(--f-d);font-weight:600;font-size:13px;letter-spacing:.04em;border:1px solid var(--line-strong);border-radius:4px 8px 8px 4px;padding:0 8px;background:var(--surface);white-space:nowrap}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn-p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-ok{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.ph h2{font-size:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.bar{height:12px;border-radius:6px;background:var(--surface-2);display:flex;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--surface-2);text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* login */
.login{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:24px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.field input,.field select,textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:15px;width:100%}
.err{color:var(--crit);font-size:14px;margin:0}
.otp{letter-spacing:.5em;font-family:var(--f-d);font-size:22px!important;text-align:center}

/* shell: sidebar ซ้าย + เนื้อหา */
body{padding:0}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{padding:0 8px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.side .brand b{font-family:var(--f-d);font-size:20px}
.side .brand div{font-size:12px;color:var(--muted)}
.nav{border:0;background:transparent;border-radius:9px;padding:8px 12px;font-weight:500;color:var(--ink-2);text-align:left;display:flex;align-items:center;gap:10px;width:100%}
.nav:hover{background:var(--surface-2)}
.nav[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav .ic{width:18px;text-align:center}
.nav .n{margin-left:auto;font-size:12px;background:var(--crit-dot);color:#fff;border-radius:9px;padding:0 6px}
.navsep{font-size:11px;color:var(--muted);padding:12px 12px 2px;text-transform:uppercase;letter-spacing:.06em}
.side-foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.main{padding:0 22px 40px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:16px;position:sticky;top:0;background:var(--bg);z-index:5}
.top h1{font-size:20px;margin-right:auto}
.burger{display:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;width:38px;height:36px;font-size:18px}
.scrim{display:none}
.wrap{max-width:1180px;margin:0 auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:80;padding:16px}
.modal > div{background:var(--surface);border-radius:14px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center}
.pinbig{font-family:var(--f-d);font-size:44px;letter-spacing:.25em;font-weight:700}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
  .burger{display:inline-block}
  .main{padding:0 14px 40px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

/* overview */
.band{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px 30px}
.big{font-family:var(--f-d);font-size:48px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--muted);font-weight:500}
.row3{display:grid;grid-template-columns:110px minmax(0,1fr) 190px;gap:10px;align-items:center;font-size:14px}
.row3 .r{text-align:right;font-size:13px;color:var(--ink-2)}
.zones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.zones div{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted)}
.zones b{display:block;font-family:var(--f-d);font-size:18px;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .n{font-family:var(--f-d);font-size:34px;font-weight:600;line-height:1.1}
.kpi .n small{font-size:15px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .s{font-size:13px;color:var(--ink-2)}
.cond{display:flex;flex-wrap:wrap;gap:8px 32px;align-items:center}
.cond div{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-2);line-height:1.35}
.cond .n{font-family:var(--f-d);font-size:40px;font-weight:600;line-height:1}
.fail{display:grid;grid-template-columns:170px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:14px;margin:4px 0}
.fail .bar{height:9px}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.days{font-family:var(--f-d);font-weight:600;font-size:18px;text-align:right;line-height:1.1}
.days small{display:block;font-family:var(--f-b);font-size:11px;color:var(--muted);font-weight:400}

/* queue */
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rv{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.photo{background:var(--surface-2);border-radius:10px;min-height:220px;display:grid;place-items:center;overflow:hidden;font-size:13px;color:var(--muted)}
.photo img{width:100%;height:auto;display:block;cursor:zoom-in}
.rv-b{display:flex;flex-direction:column;gap:8px;min-width:0}
.rv-t{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.read{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 16px;font-size:13px}
.read div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:2px}
.read span:first-child{color:var(--muted)}
.bad{color:var(--crit);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.edit{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.er{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;font-size:14px}
.opts{display:flex;gap:4px}
.opts button{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:2px 10px;font-size:13px}
.opts button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:50;padding:12px}
.zoom img{max-width:100%;max-height:100%}

/* report */
.report{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 30px;display:flex;flex-direction:column;gap:22px;max-width:1000px;margin:0 auto}
.rp-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.rp-h h1{font-size:24px}
.rk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rk > div{padding:12px 14px;border-right:1px solid var(--line)}
.rk > div:last-child{border-right:0}
.rk .n{font-family:var(--f-d);font-size:34px;font-weight:600;line-height:1.1}
.blank{background:repeating-linear-gradient(-45deg,transparent 0 8px,var(--surface-2) 8px 9px);min-width:170px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60}
.loading{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent) 30%,transparent 30%);background-size:200% 100%;animation:ld 1s linear infinite;z-index:70}
@keyframes ld{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.loading{animation:none}}
@media (max-width:900px){.grid2,.band,.rv{grid-template-columns:1fr}.kpis,.rk{grid-template-columns:repeat(2,minmax(0,1fr))}.rk > div{border-bottom:1px solid var(--line)}.zones{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.row3{grid-template-columns:1fr}.row3 .r{text-align:left}.read{grid-template-columns:1fr}.fail{grid-template-columns:120px minmax(0,1fr) 48px}.report{padding:16px}}
@media print{
  body{background:#fff;color:#000;padding:0}
  .side,.top,.scrim,.no-print,#toast{display:none!important}
  .shell{display:block}.main{padding:0}
  .report{border:0;padding:0;max-width:none}
  :root{--ink:#000;--surface:#fff;--surface-2:#f2f2f2;--line:#bbb;--muted:#444;--ink-2:#222}
}
</style>
</head>
<body>
<div class="loading" id="loading" hidden></div>

<div id="login" class="login" hidden>
  <div><div class="muted small" id="lg-org">FireCheck</div><h1>Dashboard ทีม ENV</h1></div>
  <div id="lg-step1" class="stack" style="gap:12px">
    <label class="field" for="lg-email">Gmail ที่ได้รับสิทธิ์<input id="lg-email" type="email" autocomplete="email" inputmode="email" placeholder="name@gmail.com"></label>
    <button class="btn btn-p" id="lg-send">ส่งรหัส OTP ทางอีเมล</button>
  </div>
  <div id="lg-step2" class="stack" style="gap:12px" hidden>
    <p class="small muted" style="margin:0" id="lg-sent"></p>
    <label class="field" for="lg-code">รหัส OTP 6 หลัก<input id="lg-code" class="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label>
    <button class="btn btn-p" id="lg-verify">เข้าสู่ระบบ</button>
    <button class="btn" id="lg-back">เปลี่ยนอีเมล / ขอรหัสใหม่</button>
  </div>
  <p class="err" id="lg-err" hidden></p>
  <p class="small muted" style="margin:0" id="lg-ver"></p>
</div>

<div id="app" class="shell" hidden>
  <aside class="side" id="side">
    <div class="brand"><b>FireCheck</b><div id="org"></div></div>
    <button class="nav" data-page="over"><span class="ic">◧</span>ภาพรวม</button>
    <button class="nav" data-page="queue"><span class="ic">✓</span>คิวยืนยันผล AI<span class="n" id="q-n" hidden></span></button>
    <button class="nav" data-page="spot"><span class="ic">⚑</span>สุ่มตรวจซ้ำ</button>
    <button class="nav" data-page="reg"><span class="ic">☰</span>ทะเบียนถัง</button>
    <button class="nav" data-page="report"><span class="ic">▤</span>สรุป กกบ.</button>
    <div class="navsep">ผู้ใช้</div>
    <button class="nav" data-page="staff"><span class="ic">☎</span>ช่างผู้ตรวจ (LINE)</button>
    <button class="nav" data-page="admins" data-admin hidden><span class="ic">✉</span>ผู้ดูแล Dashboard</button>
    <div class="side-foot">
      <span id="who"></span>
      <button class="btn" id="logout">ออกจากระบบ</button>
      <span id="ver"></span>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <div class="wrap">
      <header class="top">
        <button class="burger" id="burger" aria-label="เมนู">☰</button>
        <h1 id="page-title">ภาพรวม</h1>
        <label class="small muted" for="round-sel">รอบ <select id="round-sel" class="btn"></select></label>
        <button class="btn" id="refresh">รีเฟรช</button>
      </header>
      <section id="v-over" class="stack"></section>
      <section id="v-queue" class="stack" hidden></section>
      <section id="v-spot" class="stack" hidden></section>
      <section id="v-reg" class="stack" hidden></section>
      <section id="v-report" hidden></section>
      <section id="v-staff" class="stack" hidden></section>
      <section id="v-admins" class="stack" hidden></section>
    </div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
var APP_VERSION='2.0.0';
var API=window.FIRECHECK_API||'';
var TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var ITEMS=[['pin','สลักและสายฉีด'],['lever','คันบีบและข้อต่อ'],['body','สภาพตัวถัง'],['gauge','เกจวัดแรงดัน'],['powder','ผงเคมีไม่จับตัวแข็ง'],['mount','จุดติดตั้ง ป้าย ทางเข้าถึง']];
var RES={ready:['พร้อมใช้','ok'],broken:['ชำรุด','crit'],absent:['ไม่อยู่ที่จุด','absent'],unknown:['รอผล','warn'],nodata:['ไม่มีข้อมูล','mute']};
var INS={ontime:['ตรวจตรงเวลา','ok'],late:['ตรวจช้า','warn'],missing:['ไม่ได้ตรวจ','crit'],pending:['ยังไม่ตรวจ','mute'],notstarted:['ยังไม่เริ่มรอบ','mute']};
var REV={auto:['รับผลอัตโนมัติ','ok'],pending:['รอยืนยัน','warn'],confirmed:['ยืนยันแล้ว','ok'],corrected:['แก้ไขแล้ว','acc'],retake:['ขอถ่ายใหม่','crit'],processing:['กำลังอ่านรูป','mute'],error:['อ่านรูปไม่สำเร็จ','crit'],needtank:['รอระบุรหัสถัง','warn']};
var VAL={ok:'ปกติ',bad:'ผิดปกติ',blank:'ว่าง',unclear:'อ่านไม่ชัด'};
var FOUND={found:'พบ',not_found:'ไม่พบ',blank:'ว่าง',unclear:'อ่านไม่ชัด'};
var TS={EXIF:'เวลาในรูป',CARD:'วันที่บนบัตร',SENT:'เวลาส่ง LINE',APP:'แอป'};
var ROLE={ADMIN:'ผู้ดูแลระบบ',ENV:'ทีม ENV',VIEW:'ดูอย่างเดียว'};
var PAGES={over:'ภาพรวม',queue:'คิวยืนยันผล AI',spot:'สุ่มตรวจซ้ำ',reg:'ทะเบียนถัง',report:'สรุป กกบ.',staff:'ช่างผู้ตรวจ (LINE)',admins:'ผู้ดูแล Dashboard'};

var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var td=function(iso,full){if(!iso)return '–';var p=String(iso).slice(0,10).split('-').map(Number);var y=p[0]+543;return p[2]+' '+TH_M[p[1]-1]+' '+(full?y:String(y).slice(2));};
var tm=function(iso){return iso?String(iso).slice(11,16):'';};
var pill=function(pair){return '<span class="pill c-'+pair[1]+'">'+esc(pair[0])+'</span>';};
var pct=function(a,b){return b?Math.round(a/b*100):0;};

var store={get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}},del:function(k){try{localStorage.removeItem(k);}catch(e){}}};
var S={token:store.get('fc_token'),user:null,D:null,tab:'over',qtab:'pending',roundId:null,photos:{},edits:{},staff:null,admins:null,apiVersion:''};

/* ---------- เรียก API (Apps Script) ---------- */
var busy=0;
function api(action,params,quiet){
  if(!API||API.indexOf('ใส่_')>=0)return Promise.reject(new Error('ยังไม่ได้ตั้งค่า FIRECHECK_API ในไฟล์ config.js'));
  var body=Object.assign({action:action,token:S.token},params||{});
  if(!quiet){busy++;$('#loading').hidden=false;}

  var a=e.target.closest('[data-act]');if(!a)return;

  if(act==='cancel'){art.querySelector('[data-edit]').hidden=true;art.querySelector('[data-acts]').hidden=false;return;}

  var p={rowId:rowId,roundId:S.roundId};

});

      '<div><div class="small muted">ตรวจตรงตามกำหนด</div><div class="n">'+pct(s.ontime,n)+'%</div><div class="small">ตรงเวลา '+s.ontime+' · ช้า '+s.late+' · ไม่ได้ตรวจ '+s.missing+'</div></div>'+
      '<div><div class="small muted">ส่งข้อมูลตรงเวลา</div><div class="n">'+pct(s.submitOntime,s.submitOntime+s.submitLate)+'%</div><div class="small">'+s.submitOntime+'/'+(s.submitOntime+s.submitLate)+' ถัง</div></div>'+
      '<div><div class="small muted">สุ่มตรวจโดยทีม ENV</div><div class="n">'+s.spotMatch+'/'+s.spotChecked+'</div><div class="small">ตรงกับผลในระบบ</div></div>'+

    '<div><h2 style="font-size:18px;margin-bottom:8px">สรุปสภาพถังดับเพลิง</h2>'+zoneTable()+
      '<p class="small" style="margin:8px 0 0">'+(broken.length?'<b class="tx-crit">ชำรุด</b> '+broken.map(function(t){return t.id+' '+esc(t.loc)+(t.badItems.length?' ('+esc(t.badItems.join(', '))+')':'');}).join(' · '):'ไม่มีถังชำรุด')+

      D.trend.map(function(r){return '<tr><td>'+esc(r.label)+'</td><td class="num">'+r.inspected+'/'+r.total+'</td><td class="num">'+r.ontime+'</td><td class="num">'+r.missing+'</td><td class="num">'+r.ready+'</td><td class="num">'+(r.spotChecked?r.spotMatch+'/'+r.spotChecked:'–')+'</td></tr>';}).join('')+
    '</tbody></table></div></div>'+
    '<div><h2 style="font-size:18px;margin-bottom:4px">ประเด็นเสนอที่ประชุมพิจารณา</h2><p class="small muted" style="margin:0 0 8px">คอลัมน์สุดท้ายเว้นไว้บันทึกมติ/ข้อสั่งการในที่ประชุม</p>'+
      '<div class="table-wrap"><table><thead><tr><th>ที่</th><th>เรื่อง</th><th>ข้อเสนอจากทีม ENV</th><th>มติที่ประชุม / ข้อสั่งการ</th></tr></thead><tbody>'+
      issues(absent,broken,missing,s).join('')+'</tbody></table></div></div>'+

function issues(absent,broken,missing,s){
  var out=[],i=0;
  if(absent.length)out.push(['ถังไม่อยู่ที่จุดติดตั้ง '+absent.length+' ถัง'+(absent[0].openDays!=null?' — ค้างนานสุด '+absent[0].id+' ('+absent[0].openDays+' วัน)':''),'นำถังกลับติดตั้งหรือจัดหาทดแทน และกำหนดขั้นตอนยืม–คืนถังเมื่อนำไปซ้อมแผน']);
  if(broken.length)out.push(['ถังชำรุด '+broken.length+' ถัง: '+broken.map(function(t){return t.id;}).join(', '),'ซ่อมหรือเปลี่ยนก่อนรอบถัดไป และแจ้งผลกลับทีม ENV']);
  if(missing.length||s.late)out.push(['ไม่ได้ตรวจ '+missing.length+' ถัง · ตรวจช้า '+s.late+' ถัง'+(missing.length?': '+missing.map(function(t){return t.id;}).join(', '):''),'ตรวจเพิ่มให้ครบ และวางแผนวันตรวจให้อยู่ในช่วงที่กำหนด']);
  if(s.spotChecked&&s.spotMatch<s.spotChecked)out.push(['ผลสุ่มตรวจไม่ตรงกับระบบ '+(s.spotChecked-s.spotMatch)+' ถัง','ทบทวนวิธีตรวจกับช่างผู้ตรวจ']);
  if(!out.length)out.push(['ไม่มีประเด็นผิดปกติในรอบนี้','–']);
  return out.map(function(r){i++;return '<tr><td>'+i+'</td><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td class="blank"></td></tr>';});
}
